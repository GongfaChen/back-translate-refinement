name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: bt_common self-check (token extraction order)
        run: python scripts/bt_common.py

      - name: License self-test (RFC 8032 vectors)
        run: python scripts/license_check.py --self-test

      - name: Environment gate
        run: python scripts/check_env.py

      - name: Glossary validate (demo table)
        run: python scripts/glossary.py validate --glossary demo/glossary.csv

      - name: End-to-end smoke (guard must catch all planted defects)
        run: python demo/smoke_test.py demo

      # 默认是 golden-file 校验模式：产物写临时目录、与仓库内版本逐字比对（忽略 generated_at），
      # 不修改工作区；文件内容真变了才红，要更新基准用 --update。
      - name: Real-case replay (golden-file check: guard PASS + 0 fact drift + artifacts unchanged)
        run: python demo/real-case/run_real_case.py

      - name: Probe on demo source
        run: python scripts/bt_probe.py demo/sample_zh.md --glossary demo/glossary.csv
